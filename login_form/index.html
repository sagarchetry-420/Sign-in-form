<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>

<body>
    <div class="baap">
        <div class="container">

            <div class="left-section">

                <p class="signin-label">Sign In</p>
                <div class="socials">
                    <a href="#" class="social-image-div"> <img src="assets/google.png" alt="not found" class="social-logos">
                    </a>
                    <a href="#" class="social-image-div"> <img src="assets/facebook.png" alt="not found" class="social-logos">
                    </a>
                    <a href="#" class="social-image-div"><img src="assets/github.png" alt="not found" class="social-logos">
                    </a>
                    <a href="#" class="social-image-div"><img src="assets/linkedin.png" alt="not found" class="social-logos">
                    </a>
                </div>
                <form action="#" class="form-signin">
                    <p class="signin-instruction">or use your email password</p>
                    <div class="signin-inputs">
                        <input type="email" class="email-input" placeholder="Email">
                        <input type="password" placeholder="Password">
                    </div>
                    <a href="#">
                        <p class="forgot-password-label">Forgot Your Password?</p>
                    </a>
                    <button type="submit" class="signin-button">sign in</button>
                </form>

            </div>

            <div class="right-section">

                <p class="hello-label">Hello, Friend!</p>
                <p class="desc">Register with your personal details to use all of site features</p>
                <button type="button" class="signup-button">sign up</button>
            </div>
        </div>
    </div>
</body>

</html>
